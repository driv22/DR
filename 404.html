<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Record not found · Dan Rivero</title>
<meta name="robots" content="noindex" />
<meta name="description" content="That record does not exist at driv.space. Return to the change record." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..800;1,62..125,400..600&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:      #f7f8f5;
  --band:       #dde8d6;
  --band-soft:  #ebf1e7;
  --ink:        #12150f;
  --ink-2:      #4a5147;
  --rule:       #12150f;
  --rule-soft:  #c2c9ba;
  --stamp:      #a63417;
  --stamp-on:   #ffffff;
  --perf:       #d2d9c9;
  --gutter: clamp(1.25rem, 4vw, 3.5rem);
  --step-xs: 0.6875rem;
  --step-s:  0.8125rem;
  --step-m:  clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
  --step-2xl:clamp(2.4rem, 1.4rem + 5vw, 5rem);
}
html[data-theme='night'] {
  --paper:      #101310;
  --band:       rgba(163,208,152,0.085);
  --band-soft:  rgba(163,208,152,0.042);
  --ink:        #e9ede6;
  --ink-2:      #a3ad9d;
  --rule:       #e9ede6;
  --rule-soft:  rgba(233,237,230,0.19);
  --stamp:      #ff9b73;
  --stamp-on:   #1c0f07;
  --perf:       rgba(233,237,230,0.10);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100svh;
  display: grid;
  align-content: center;
  background: var(--paper);
  color: var(--ink);
  font-family: Archivo, ui-sans-serif, system-ui, sans-serif;
  font-size: var(--step-m);
  line-height: 1.6;
  font-synthesis-weight: none;
  -webkit-font-smoothing: antialiased;
}
.perf {
  display: block; position: fixed; top: 0; bottom: 0;
  width: 30px; height: 100%; z-index: 3; pointer-events: none;
  color: var(--perf); background: var(--paper);
}
.perf-dot { fill: var(--perf); }
.perf-l { left: 0;  border-right: 1px solid var(--rule-soft); }
.perf-r { right: 0; border-left:  1px solid var(--rule-soft); }
@media (max-width: 1180px) { .perf { display: none; } }

.shell { width: min(52rem, 100%); margin-inline: auto; padding-inline: var(--gutter); padding-block: clamp(3rem, 8vw, 6rem); }

.label {
  font-family: 'Courier Prime', ui-monospace, monospace;
  font-size: var(--step-xs); letter-spacing: 0.13em;
  text-transform: uppercase; color: var(--ink-2); display: block;
}
.docline {
  display: flex; flex-wrap: wrap; gap: 0.4rem 2rem;
  padding-bottom: 0.9rem; border-bottom: 1px solid var(--rule-soft);
  font-family: 'Courier Prime', ui-monospace, monospace;
  font-size: var(--step-xs); letter-spacing: 0.13em;
  text-transform: uppercase; color: var(--ink-2);
}
.docline b { color: var(--ink); font-weight: 400; }

h1 {
  margin: clamp(1.5rem, 4vw, 2.75rem) 0 0;
  font-size: var(--step-2xl); font-stretch: 112%; font-weight: 800;
  letter-spacing: -0.045em; line-height: 0.88; text-transform: uppercase;
}
.rule { height: 2px; background: var(--rule); margin-top: clamp(1.25rem, 3vw, 2rem); }

.stamp {
  display: inline-block; margin-top: clamp(1.5rem, 4vw, 2.5rem);
  border: 2.5px solid var(--stamp);
  box-shadow: 0 0 0 1.5px var(--paper), 0 0 0 4px var(--stamp);
  color: var(--stamp); padding: 0.6rem 1.15rem 0.5rem;
  text-align: center; transform: rotate(-4deg);
  font-family: 'Courier Prime', monospace; white-space: nowrap;
}
.stamp b { display: block; font-size: clamp(1rem, 2.2vw, 1.4rem); font-weight: 700; letter-spacing: 0.1em; line-height: 1; }
.stamp i { display: block; font-style: normal; font-size: var(--step-xs); letter-spacing: 0.19em; margin-top: 0.4rem; opacity: 0.85; }
@media (prefers-reduced-motion: no-preference) {
  .stamp { animation: land 720ms cubic-bezier(0.16, 1, 0.3, 1) 300ms both; }
  @keyframes land {
    0%   { opacity: 0; transform: rotate(-16deg) scale(1.75); }
    60%  { opacity: 1; transform: rotate(-2deg) scale(0.97); }
    100% { opacity: 1; transform: rotate(-4deg) scale(1); }
  }
}

p.lede { max-width: 46ch; color: var(--ink-2); margin: clamp(1.75rem, 4vw, 2.5rem) 0 0; }

.fields { margin-top: clamp(1.75rem, 4vw, 2.5rem); border-top: 1px solid var(--rule-soft); }
.fields dl { display: grid; grid-template-columns: repeat(2, 1fr); margin: 0; }
@media (max-width: 380px) { .fields dl { grid-template-columns: 1fr; } }
.fields div { padding: 0.85rem 1rem; border-right: 1px solid var(--rule-soft); border-bottom: 1px solid var(--rule-soft); }
.fields div:nth-child(odd) { background: var(--band); }
.fields div:nth-child(even) { background: var(--band-soft); }
.fields div:last-child { border-right: none; }
.fields dd { margin: 0.3rem 0 0; font-family: 'Courier Prime', monospace; font-size: var(--step-s); line-height: 1.35; }

.actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: clamp(1.75rem, 4vw, 2.5rem); }
.btn {
  display: inline-block; text-decoration: none;
  padding: 0.95rem 1.6rem; border: 2px solid var(--stamp);
  background: var(--stamp); color: var(--stamp-on);
  font-family: 'Courier Prime', monospace; font-size: var(--step-s);
  letter-spacing: 0.13em; text-transform: uppercase; font-weight: 700;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn:hover { opacity: 0.86; }
.btn:focus-visible, a:focus-visible { outline: 3px solid var(--stamp); outline-offset: 3px; }
</style>
<script>
  try { var t = localStorage.getItem('driv-theme'); if (t) document.documentElement.dataset.theme = t; }
  catch (e) {}
</script>
</head>
<body>

<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <pattern id="perfpat" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="3.75" class="perf-dot" />
    </pattern>
  </defs>
</svg>
<svg class="perf perf-l" aria-hidden="true" focusable="false"><rect width="100%" height="100%" fill="url(#perfpat)" /></svg>
<svg class="perf perf-r" aria-hidden="true" focusable="false"><rect width="100%" height="100%" fill="url(#perfpat)" /></svg>

<main class="shell">
  <div class="docline">
    <span><b>DRIV.SPACE</b></span>
    <span>Personnel change record</span>
    <span>Error 404</span>
  </div>

  <h1>Record<br />not found</h1>
  <div class="rule"></div>

  <div class="stamp"><b>NO SUCH SHEET</b><i>404</i></div>

  <p class="lede">The address you asked for is not filed here. Nothing was lost. This page never existed, or it moved when the record was rewritten.</p>

  <div class="fields">
    <dl>
      <div>
        <dt class="label">Requested</dt>
        <dd id="req">—</dd>
      </div>
      <div>
        <dt class="label">Status</dt>
        <dd>Not on file</dd>
      </div>
    </dl>
  </div>

  <div class="actions">
    <a class="btn" href="/">Back to the record</a>
    <a class="btn ghost" href="mailto:DLRivero2@gmail.com">Send a note</a>
  </div>
</main>

<script>
  var el = document.getElementById('req');
  var p = (location.pathname || '/').slice(0, 64);
  el.textContent = p === '/' ? '—' : p;
</script>
</body>
</html>
